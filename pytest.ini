[pytest]
minversion = 8.0
addopts =
    -ra
    --strict-config
    --strict-markers
xfail_strict = true
testpaths =
    imaging_transcriptomics/tests
filterwarnings =
    ignore:`row_stack` alias is deprecated.*:DeprecationWarning
    ignore:pkg_resources is deprecated as an API.*:UserWarning
    ignore:Falling back to within-hemisphere random cortical permutations because surface nulls are unavailable.*:RuntimeWarning
