<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc" style="display: block; height: auto; max-width: 1100px;">
  <title id="title">Interactive workflow hub</title>
  <desc id="desc">Clickable overview of the main workflows in imaging-transcriptomics.</desc>
  <defs>
    <style>
      .heading { font: 700 24px Arial, sans-serif; fill: #111827; }
      .sub { font: 14px Arial, sans-serif; fill: #4b5563; }
      .box { stroke: #334155; stroke-width: 2; rx: 18; ry: 18; transition: transform 0.15s ease; }
      .title { font: 700 18px Arial, sans-serif; fill: #1f2937; }
      .text { font: 13px Arial, sans-serif; fill: #1f2937; }
      a:hover .box { stroke: #0f172a; stroke-width: 3; }
      a:hover .title, a:hover .text { fill: #0f172a; }
    </style>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="heading">Choose a workflow</text>
  <text x="550" y="68" text-anchor="middle" class="sub">Click a box to open the detailed guide for that workflow.</text>

  <a href="workflows/correlation.html" target="_top">
    <rect x="60" y="110" width="290" height="105" class="box" fill="#dbeafe" />
    <text x="205" y="140" text-anchor="middle" class="title">Correlation</text>
    <text x="205" y="164" text-anchor="middle" class="text">Gene-wise association between</text>
    <text x="205" y="182" text-anchor="middle" class="text">one imaging map and atlas expression</text>
    <text x="205" y="200" text-anchor="middle" class="text">Fast first-pass workflow</text>
  </a>

  <a href="workflows/pls.html" target="_top">
    <rect x="405" y="110" width="290" height="105" class="box" fill="#ede9fe" />
    <text x="550" y="140" text-anchor="middle" class="title">PLS</text>
    <text x="550" y="164" text-anchor="middle" class="text">Multivariate components linking</text>
    <text x="550" y="182" text-anchor="middle" class="text">the imaging map to many genes</text>
    <text x="550" y="200" text-anchor="middle" class="text">Best for distributed signals</text>
  </a>

  <a href="workflows/enrichment.html" target="_top">
    <rect x="750" y="110" width="290" height="105" class="box" fill="#fce7f3" />
    <text x="895" y="140" text-anchor="middle" class="title">Enrichment</text>
    <text x="895" y="164" text-anchor="middle" class="text">GSEA and ORA on correlation</text>
    <text x="895" y="182" text-anchor="middle" class="text">or PLS gene outputs</text>
    <text x="895" y="200" text-anchor="middle" class="text">Pathways, NES, odds ratios</text>
  </a>

  <a href="workflows/gene_pca.html" target="_top">
    <rect x="195" y="260" width="290" height="105" class="box" fill="#fee2e2" />
    <text x="340" y="290" text-anchor="middle" class="title">Gene PCA</text>
    <text x="340" y="314" text-anchor="middle" class="text">Reduce a selected gene list to</text>
    <text x="340" y="332" text-anchor="middle" class="text">regional principal components</text>
    <text x="340" y="350" text-anchor="middle" class="text">Descriptive gene-pattern workflow</text>
  </a>

  <a href="workflows/gedar.html" target="_top">
    <rect x="615" y="260" width="290" height="105" class="box" fill="#dcfce7" />
    <text x="760" y="290" text-anchor="middle" class="title">GEDAR</text>
    <text x="760" y="314" text-anchor="middle" class="text">Project a weighted gene table onto</text>
    <text x="760" y="332" text-anchor="middle" class="text">the atlas expression matrix</text>
    <text x="760" y="350" text-anchor="middle" class="text">Regional transcriptomic score map</text>
  </a>
</svg>
