<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="240" viewBox="0 0 1100 240" role="img" aria-labelledby="title desc">
  <title id="title">Imaging transcriptomics workflow overview</title>
  <desc id="desc">Schematic showing imaging input, atlas extraction, null generation, gene-level analysis, and enrichment outputs.</desc>
  <defs>
    <style>
      .title { font: 700 16px Arial, sans-serif; fill: #1f2937; }
      .label { font: 13px Arial, sans-serif; fill: #1f2937; }
      .small { font: 12px Arial, sans-serif; fill: #4b5563; }
      .box { stroke: #334155; stroke-width: 2; rx: 14; ry: 14; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>

  <rect x="40" y="80" width="170" height="80" class="box" fill="#dbeafe" />
  <text x="125" y="108" text-anchor="middle" class="title">Imaging input</text>
  <text x="125" y="132" text-anchor="middle" class="label">Vector, NIfTI, or surface</text>
  <text x="125" y="150" text-anchor="middle" class="small">Aligned to the chosen atlas</text>

  <rect x="250" y="80" width="180" height="80" class="box" fill="#dcfce7" />
  <text x="340" y="108" text-anchor="middle" class="title">Atlas extraction</text>
  <text x="340" y="132" text-anchor="middle" class="label">Regional values</text>
  <text x="340" y="150" text-anchor="middle" class="small">Hemisphere and region scope applied</text>

  <rect x="470" y="80" width="180" height="80" class="box" fill="#fef3c7" />
  <text x="560" y="108" text-anchor="middle" class="title">Null generation</text>
  <text x="560" y="132" text-anchor="middle" class="label">Spatial or grouped permutations</text>
  <text x="560" y="150" text-anchor="middle" class="small">Shared by corr and PLS</text>

  <rect x="690" y="40" width="170" height="80" class="box" fill="#fee2e2" />
  <text x="775" y="68" text-anchor="middle" class="title">Correlation</text>
  <text x="775" y="92" text-anchor="middle" class="label">Gene-wise scores, p, FDR</text>
  <text x="775" y="110" text-anchor="middle" class="small">Fast ranked association</text>

  <rect x="690" y="130" width="170" height="80" class="box" fill="#ede9fe" />
  <text x="775" y="158" text-anchor="middle" class="title">PLS</text>
  <text x="775" y="182" text-anchor="middle" class="label">Components, weights, p</text>
  <text x="775" y="200" text-anchor="middle" class="small">Multivariate gene patterns</text>

  <rect x="900" y="80" width="170" height="80" class="box" fill="#fce7f3" />
  <text x="985" y="108" text-anchor="middle" class="title">Enrichment</text>
  <text x="985" y="132" text-anchor="middle" class="label">GSEA and ORA</text>
  <text x="985" y="150" text-anchor="middle" class="small">Pathways, odds ratios, NES</text>

  <path d="M210 120 L250 120" class="arrow" />
  <path d="M430 120 L470 120" class="arrow" />
  <path d="M650 120 L690 80" class="arrow" />
  <path d="M650 120 L690 170" class="arrow" />
  <path d="M860 80 L900 100" class="arrow" />
  <path d="M860 170 L900 140" class="arrow" />
</svg>
