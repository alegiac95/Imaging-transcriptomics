<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="290" viewBox="0 0 1100 290" role="img" aria-labelledby="title desc">
  <title id="title">Imaging transcriptomics workflow overview</title>
  <desc id="desc">Schematic showing imaging input, atlas extraction, null generation, gene-level analysis, and enrichment outputs.</desc>
  <defs>
    <style>
      .title { font: 700 16px Arial, sans-serif; fill: #1f2937; }
      .label { font: 13px Arial, sans-serif; fill: #1f2937; }
      .small { font: 12px Arial, sans-serif; fill: #4b5563; }
      .box { stroke: #334155; stroke-width: 2; rx: 16; ry: 16; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>

  <rect x="30" y="105" width="175" height="90" class="box" fill="#dbeafe" />
  <text x="118" y="133" text-anchor="middle" class="title">Imaging input</text>
  <text x="118" y="156" text-anchor="middle" class="label">Vector, NIfTI,</text>
  <text x="118" y="174" text-anchor="middle" class="label">or surface</text>
  <text x="118" y="192" text-anchor="middle" class="small">Aligned to the chosen atlas</text>

  <rect x="235" y="105" width="190" height="90" class="box" fill="#dcfce7" />
  <text x="330" y="133" text-anchor="middle" class="title">Atlas extraction</text>
  <text x="330" y="156" text-anchor="middle" class="label">Regional values</text>
  <text x="330" y="174" text-anchor="middle" class="small">Hemisphere and region</text>
  <text x="330" y="190" text-anchor="middle" class="small">scope applied</text>

  <rect x="455" y="105" width="195" height="90" class="box" fill="#fef3c7" />
  <text x="553" y="133" text-anchor="middle" class="title">Null generation</text>
  <text x="553" y="156" text-anchor="middle" class="label">Spatial or grouped</text>
  <text x="553" y="174" text-anchor="middle" class="label">permutations</text>
  <text x="553" y="192" text-anchor="middle" class="small">Shared by corr and PLS</text>

  <rect x="690" y="40" width="180" height="95" class="box" fill="#fee2e2" />
  <text x="780" y="68" text-anchor="middle" class="title">Correlation</text>
  <text x="780" y="92" text-anchor="middle" class="label">Gene-wise scores,</text>
  <text x="780" y="110" text-anchor="middle" class="label">p, FDR, and maxT</text>

  <rect x="690" y="155" width="180" height="95" class="box" fill="#ede9fe" />
  <text x="780" y="183" text-anchor="middle" class="title">PLS</text>
  <text x="780" y="207" text-anchor="middle" class="label">Components, weights,</text>
  <text x="780" y="225" text-anchor="middle" class="label">and permutation p</text>

  <rect x="905" y="105" width="165" height="90" class="box" fill="#fce7f3" />
  <text x="988" y="133" text-anchor="middle" class="title">Enrichment</text>
  <text x="988" y="156" text-anchor="middle" class="label">GSEA and ORA</text>
  <text x="988" y="174" text-anchor="middle" class="small">Pathways, odds ratios,</text>
  <text x="988" y="190" text-anchor="middle" class="small">and NES</text>

  <path d="M205 150 L235 150" class="arrow" />
  <path d="M425 150 L455 150" class="arrow" />
  <path d="M650 150 L690 90" class="arrow" />
  <path d="M650 150 L690 200" class="arrow" />
  <path d="M870 90 L905 125" class="arrow" />
  <path d="M870 200 L905 175" class="arrow" />
</svg>
