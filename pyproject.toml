[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imaging-transcriptomics"
version = "2.0.0"
description = "Functional imaging transcriptomics workflows with atlas-aware scan extraction and abagen-derived expression matrices."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Alessio Giacomel"},
  {name = "Daniel Martins"},
]
keywords = ["neuroimaging", "transcriptomics", "brain maps", "abagen", "imaging transcriptomics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "statsmodels>=0.14",
  "nibabel>=5.2",
]

[project.optional-dependencies]
plots = [
  "matplotlib>=3.8",
]
gsea = [
  "gseapy>=1.1.3",
]
maps = [
  "neuromaps>=0.0.5",
  "abagen>=0.1.3",
  "brainspace>=0.1.20",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.3.0",
  "build>=1.2.0",
  "twine>=5.0.0",
  "matplotlib>=3.8",
]

[project.urls]
Source = "https://github.com/alegiac95/Imaging-transcriptomics"
Issues = "https://github.com/alegiac95/Imaging-transcriptomics/issues"
Documentation = "https://imaging-transcriptomics.rtfd.io/"

[project.scripts]
imagingtranscriptomics = "imaging_transcriptomics.cli:main"
imt = "imaging_transcriptomics.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["imaging_transcriptomics*"]

[tool.setuptools.package-data]
imaging_transcriptomics = [
  "data/**/*",
]
