name: Containers

on:
  push:
    branches:
      - refactor-v2.0.0
  pull_request:
    branches:
      - refactor-v2.0.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uv-environment:
    name: uv environment
    runs-on: ubuntu-latest

    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      UV_CACHE_DIR: /tmp/uv-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install uv
        run: python -m pip install "uv>=0.7,<1"

      - name: Create the locked uv environment
        run: uv sync --frozen --extra dev --extra plots --extra gsea --extra maps

      - name: Smoke test CLI
        run: uv run imt --help

  docker-image:
    name: docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/imaging-transcriptomics

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image for CI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          load: true
          tags: imaging-transcriptomics:ci
          cache-from: type=gha,scope=docker
          cache-to: type=gha,mode=max,scope=docker

      - name: Smoke test Docker image
        run: docker run --rm imaging-transcriptomics:ci --help

      - name: Export Docker image artifact
        run: docker save imaging-transcriptomics:ci -o /tmp/imaging-transcriptomics-docker.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: imaging-transcriptomics-docker
          path: /tmp/imaging-transcriptomics-docker.tar

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker
          cache-to: type=gha,mode=max,scope=docker

  uv-image:
    name: uv image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/imaging-transcriptomics-uv

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract uv image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build uv image for CI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile.uv
          load: true
          tags: imaging-transcriptomics:uv-ci
          cache-from: type=gha,scope=uv-image
          cache-to: type=gha,mode=max,scope=uv-image

      - name: Smoke test uv image
        run: docker run --rm imaging-transcriptomics:uv-ci --help

      - name: Export uv image artifact
        run: docker save imaging-transcriptomics:uv-ci -o /tmp/imaging-transcriptomics-uv.tar

      - name: Upload uv image artifact
        uses: actions/upload-artifact@v4
        with:
          name: imaging-transcriptomics-uv
          path: /tmp/imaging-transcriptomics-uv.tar

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish uv image
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile.uv
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=uv-image
          cache-to: type=gha,mode=max,scope=uv-image

  podman-image:
    name: podman image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build Podman image
        run: podman build --file containers/Containerfile --tag imaging-transcriptomics:podman .

      - name: Smoke test Podman image
        run: podman run --rm imaging-transcriptomics:podman --help

      - name: Export Podman image artifact
        run: podman save --format oci-archive --output /tmp/imaging-transcriptomics-podman.tar imaging-transcriptomics:podman

      - name: Upload Podman image artifact
        uses: actions/upload-artifact@v4
        with:
          name: imaging-transcriptomics-podman
          path: /tmp/imaging-transcriptomics-podman.tar

  singularity-image:
    name: singularity image
    runs-on: ubuntu-latest

    env:
      APPTAINER_CACHEDIR: /tmp/apptainer-cache
      APPTAINER_TMPDIR: /tmp/apptainer-tmp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Build Singularity image
        run: sudo apptainer build /tmp/imaging-transcriptomics.sif containers/Singularity.def

      - name: Smoke test Singularity image
        run: sudo apptainer exec /tmp/imaging-transcriptomics.sif imt --help

      - name: Upload Singularity image artifact
        uses: actions/upload-artifact@v4
        with:
          name: imaging-transcriptomics-singularity
          path: /tmp/imaging-transcriptomics.sif
