name: CI

on:
  push:
    branches:
      - refactor-v2.0.0
  pull_request:
    branches:
      - refactor-v2.0.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            coverage: false
          - os: ubuntu-latest
            python-version: "3.11"
            coverage: true
          - os: ubuntu-latest
            python-version: "3.12"
            coverage: false
          - os: macos-latest
            python-version: "3.11"
            coverage: false
          - os: windows-latest
            python-version: "3.11"
            coverage: false

    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and test dependencies
        run: |
          python -m pip install -e .[dev,plots,gsea]
          python -m pip install pytest-cov

      - name: Run tests with coverage
        if: matrix.coverage
        run: pytest --cov=imaging_transcriptomics --cov-report=term-missing --cov-report=xml

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: pytest -q

      - name: Upload coverage artifact
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml

      - name: Upload coverage reports to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
