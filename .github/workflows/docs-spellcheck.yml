name: Docs spellcheck

on:
  push:
    branches:
      - refactor-v2.0.0
    paths:
      - "docs/**"
      - "README.md"
      - ".codespellignore"
      - ".github/workflows/docs-spellcheck.yml"
  pull_request:
    branches:
      - refactor-v2.0.0
    paths:
      - "docs/**"
      - "README.md"
      - ".codespellignore"
      - ".github/workflows/docs-spellcheck.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codespell:
    name: codespell
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Spellcheck docs
        uses: codespell-project/actions-codespell@v2
        with:
          path: docs
          ignore_words_file: .codespellignore
          uri_ignore_words_list: "*"
          skip: docs/_build,docs/_static,docs/chapters/images,docs/**/data/**,**/data/**,*.png,*.jpg,*.jpeg,*.ico,*.svg

      - name: Spellcheck README
        uses: codespell-project/actions-codespell@v2
        with:
          path: README.md
          ignore_words_file: .codespellignore
          uri_ignore_words_list: "*"
          skip: **/data/**
